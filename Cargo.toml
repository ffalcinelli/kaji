[package]
name = "kaji"
version = "0.0.3"
edition = "2024"
description = "Steer your Keycloak configuration to a stable, declared state."
repository = "https://github.com/ffalcinelli/kaji"
license = "MIT"

[[bin]]
name = "kaji"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
clap = { version = "4.5.60", features = ["derive", "env"] }
dotenvy = "0.15.7"
env_logger = "0.11.9"
log = "0.4.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sanitize-filename = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
toml = "0.8.20"
tokio = { version = "1.49.0", features = ["full"] }
similar = "2.7.0"
async-trait = "0.1.86"
async-recursion = "1.1.1"
console = "0.16.3"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
futures = "0.3.32"
indicatif = "0.18.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
assert_cmd = "2.2.0"
mockito = "1.7.2"
predicates = "3.1.4"
tempfile = "3.26.0"
cargo-husky = { version = "1.5.0", features = ["run-cargo-fmt", "run-cargo-clippy", "precommit-hook"], default-features = false }

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "bench_inspect"
harness = false

[[bench]]
name = "bench_apply"
harness = false

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "models_bench"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)', 'cfg(tarpaulin)'] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading"] }
