services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev
    network_mode: host
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: ${KAJI_IT_PORT:-8080}
      KC_HTTP_MANAGEMENT_PORT: ${KAJI_IT_MGMT_PORT:-9000}
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/${KAJI_IT_MGMT_PORT:-9000} && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
